# Netlify build settings for the Ocha no Pauda website (folder: ocha-no-pauda)
[build]
  base = "ocha-no-pauda"
  command = "npm run build || (sleep 20 && npm run build)"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  # plain static site, served from the root of the Netlify address
  STATIC_EXPORT = "1"
  NEXT_PUBLIC_GH_REPO = "alkuwarik079-gif/Mm-"

# the owner menu should never be cached, so edits show up straight away
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex"
